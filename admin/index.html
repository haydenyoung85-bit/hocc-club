<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Website admin | Heart of Oklahoma Corvette Club</title>
<link rel="icon" href="../images/1b97d2c0-HOCC-Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
  /* Always load the newest admin files (GitHub Pages lets browsers cache files for 10 minutes). */
  window.HOCC_V = String(Date.now());
  document.write('<link rel="stylesheet" href="admin.css?v=' + window.HOCC_V + '">');
</script>
</head>
<body>
<main id="app" class="wrap"><p class="card center big">Loading…</p></main>
<noscript><p class="card big">Please turn on JavaScript to use the website admin.</p></noscript>
<script>
  ['config.js', 'schema.js', 'admin.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + window.HOCC_V + '"><\/script>'); });
</script>
</body>
</html>
